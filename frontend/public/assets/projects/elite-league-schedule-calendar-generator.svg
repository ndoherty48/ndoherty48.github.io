<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="871" viewBox="0 0 1472 871" role="img" aria-labelledby="eihl-calendar-card-title">
  <title id="eihl-calendar-card-title">Elite League Schedule Calendar Generator</title>
  <defs>
    <radialGradient id="ice" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#16345A"/>
      <stop offset="100%" stop-color="#0B1928"/>
    </radialGradient>
    <clipPath id="calendar-shape">
      <rect x="556" y="270.5" width="360" height="330" rx="32"/>
    </clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="4" markerHeight="4" orient="auto-start-reverse">
      <path d="M0 0 10 5 0 10z" fill="#0E2743"/>
    </marker>
  </defs>

  <rect width="1472" height="871" fill="url(#ice)"/>

  <!-- Faint rink markings: blue lines, red centre line and centre circle -->
  <g opacity="0.35">
    <rect x="296" y="0" width="22" height="871" fill="#2460B7"/>
    <rect x="1154" y="0" width="22" height="871" fill="#2460B7"/>
    <rect x="728" y="0" width="16" height="871" fill="#DE3C37"/>
  </g>
  <circle cx="736" cy="435.5" r="265" fill="none" stroke="#75CAF2" stroke-width="6" opacity="0.3"/>

  <!-- Calendar -->
  <g clip-path="url(#calendar-shape)">
    <rect x="556" y="270.5" width="360" height="330" fill="#F4F7FB"/>
    <rect x="556" y="270.5" width="360" height="80" fill="#DE3C37"/>
  </g>

  <!-- Binder rings -->
  <rect x="628" y="246" width="18" height="56" rx="9" fill="#0E2743"/>
  <rect x="826" y="246" width="18" height="56" rx="9" fill="#0E2743"/>

  <!-- Day grid: 4 x 3 -->
  <g fill="#D5DBE3">
    <rect x="586" y="380" width="60" height="50" rx="10"/>
    <rect x="666" y="380" width="60" height="50" rx="10"/>
    <rect x="746" y="380" width="60" height="50" rx="10"/>
    <rect x="826" y="380" width="60" height="50" rx="10"/>
    <rect x="586" y="450" width="60" height="50" rx="10"/>
    <rect x="746" y="450" width="60" height="50" rx="10"/>
    <rect x="826" y="450" width="60" height="50" rx="10"/>
    <rect x="586" y="520" width="60" height="50" rx="10"/>
    <rect x="666" y="520" width="60" height="50" rx="10"/>
    <rect x="746" y="520" width="60" height="50" rx="10"/>
    <rect x="826" y="520" width="60" height="50" rx="10"/>
  </g>

  <!-- Game day: highlighted cell with a puck -->
  <rect x="666" y="450" width="60" height="50" rx="10" fill="#75CAF2"/>
  <ellipse cx="696" cy="470" rx="18" ry="6.5" fill="#0E2743"/>
  <path d="M678 470v8c0 3.6 8 6.5 18 6.5s18-2.9 18-6.5v-8c0 3.6-8 6.5-18 6.5s-18-2.9-18-6.5z" fill="#0E2743"/>

  <!-- Sync badge: the calendars are subscribable and update themselves -->
  <circle cx="916" cy="600.5" r="60" fill="#75CAF2" stroke="#0E2743" stroke-width="8"/>
  <g fill="none" stroke="#0E2743" stroke-width="9" stroke-linecap="round">
    <path d="M890.4 596 A26 26 0 0 1 938.5 587.5" marker-end="url(#arrow)"/>
    <path d="M941.6 605 A26 26 0 0 1 893.5 613.5" marker-end="url(#arrow)"/>
  </g>
</svg>
