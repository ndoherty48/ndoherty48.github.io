<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="871" viewBox="0 0 1472 871" role="img" aria-labelledby="phoenixpos-card-title">
  <title id="phoenixpos-card-title">PhoenixPOS</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="55%" r="72%">
      <stop offset="0%" stop-color="#C2410C"/>
      <stop offset="55%" stop-color="#7A1E0E"/>
      <stop offset="100%" stop-color="#2A0A08"/>
    </radialGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB45C"/>
      <stop offset="100%" stop-color="#F2551F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#1A0503" flood-opacity="0.55"/>
    </filter>
  </defs>

  <rect width="1472" height="871" fill="url(#bg)"/>

  <!-- Faint rising embers -->
  <g fill="#FFC27A" opacity="0.28">
    <circle cx="160" cy="720" r="6"/><circle cx="240" cy="560" r="4"/><circle cx="330" cy="760" r="5"/>
    <circle cx="410" cy="430" r="3"/><circle cx="470" cy="640" r="6"/><circle cx="210" cy="300" r="4"/>
    <circle cx="360" cy="180" r="3"/><circle cx="520" cy="120" r="5"/><circle cx="130" cy="110" r="3"/>
    <circle cx="1010" cy="700" r="5"/><circle cx="1090" cy="520" r="3"/><circle cx="1180" cy="760" r="6"/>
    <circle cx="1250" cy="380" r="4"/><circle cx="1320" cy="620" r="5"/><circle cx="1390" cy="240" r="3"/>
    <circle cx="1140" cy="160" r="5"/><circle cx="980" cy="90" r="3"/><circle cx="1300" cy="90" r="4"/>
  </g>

  <circle cx="736" cy="435.5" r="265" fill="none" stroke="#FFB45C" stroke-width="6" opacity="0.3"/>

  <!-- App tile -->
  <rect x="576" y="275.5" width="320" height="320" rx="80" fill="#FFF7F0" filter="url(#shadow)"/>

  <!-- POS terminal: customer display behind, main screen on a stand -->
  <g transform="translate(611 310.5)">
    <rect x="22" y="30" width="86" height="104" rx="12" fill="#5B5560" transform="rotate(-10 65 82)"/>
    <path d="M100 150h52l14 62H86z" fill="#2B2730"/>
    <rect x="42" y="206" width="168" height="30" rx="14" fill="#2B2730"/>
    <g transform="rotate(-5 150 104)">
      <rect x="72" y="36" width="160" height="136" rx="16" fill="#2B2730"/>
      <rect x="84" y="48" width="136" height="112" rx="8" fill="url(#screen)"/>
      <g fill="#FFF7F0" opacity="0.9">
        <rect x="98" y="64" width="70" height="12" rx="6"/>
        <rect x="98" y="86" width="108" height="12" rx="6"/>
        <rect x="98" y="108" width="88" height="12" rx="6"/>
        <rect x="150" y="134" width="56" height="14" rx="7"/>
      </g>
    </g>
  </g>

  <!-- Phoenix flame badge -->
  <circle cx="896" cy="595.5" r="58" fill="#FFB300" stroke="#FFF7F0" stroke-width="8"/>
  <path d="M896 562c14 14 24 28 20 46-3 13-12 21-20 21s-18-7-21-19c-4-15 5-27 12-35 1 9 4 14 9 17 3-11 3-20 0-30z" fill="#B3261E"/>
</svg>
