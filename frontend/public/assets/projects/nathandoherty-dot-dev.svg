<svg xmlns="http://www.w3.org/2000/svg" width="1472" height="871" viewBox="0 0 1472 871" role="img" aria-labelledby="nd-card-title">
  <title id="nd-card-title">nathandoherty.dev</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="72%">
      <stop offset="0%" stop-color="#7611A6"/>
      <stop offset="100%" stop-color="#1C0056"/>
    </radialGradient>
    <pattern id="dots" width="48" height="48" patternUnits="userSpaceOnUse">
      <circle cx="24" cy="24" r="3" fill="#FFFFFF"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#0D0030" flood-opacity="0.55"/>
    </filter>
    <clipPath id="cloud-half">
      <rect x="0" y="0" width="255" height="270"/>
    </clipPath>
  </defs>

  <rect width="1472" height="871" fill="url(#bg)"/>

  <!-- Faint dot grid -->
  <rect width="1472" height="871" fill="url(#dots)" opacity="0.1"/>

  <circle cx="736" cy="435.5" r="265" fill="none" stroke="#C561F6" stroke-width="6" opacity="0.35"/>

  <!-- App tile -->
  <rect x="576" y="275.5" width="320" height="320" rx="80" fill="#F3F4F7" filter="url(#shadow)"/>

  <!-- Cloud + server rack icon from the Nathan Doherty Applications logo, redrawn -->
  <g transform="translate(611 368) scale(0.5)">
    <g clip-path="url(#cloud-half)" fill="#C561F6">
      <circle cx="205" cy="125" r="108"/>
      <circle cx="90" cy="195" r="75"/>
      <rect x="90" y="150" width="165" height="120"/>
    </g>
    <g fill="#7611A6">
      <rect x="275" y="0" width="225" height="78" rx="12"/>
      <rect x="275" y="96" width="225" height="78" rx="12"/>
      <rect x="275" y="192" width="225" height="78" rx="12"/>
    </g>
    <g fill="#F3F4F7">
      <circle cx="330" cy="39" r="13"/><circle cx="387" cy="39" r="13"/><circle cx="444" cy="39" r="13"/>
      <circle cx="330" cy="135" r="13"/><circle cx="387" cy="135" r="13"/><circle cx="444" cy="135" r="13"/>
      <circle cx="330" cy="231" r="13"/><circle cx="387" cy="231" r="13"/><circle cx="444" cy="231" r="13"/>
    </g>
  </g>
</svg>
